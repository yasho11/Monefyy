version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: my_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monefyy-db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 10
      timeout: 2s

  server:
    build: ./server
    container_name: monefyy_server
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
